import java.util.jar.JarFile
import org.yaml.snakeyaml.Yaml

buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath("org.yaml:snakeyaml:2.0")
    }
}

plugins {
    id 'java'
    id 'groovy'
    id 'maven-publish'
}

apply from: 'dependencies.gradle'

// Use environment instead of gradle.properties
if ("$System.env.MAVEN_URL" != null) {
    ext.MAVEN_URL = "https://forge.theflyingbirds.net/api/packages/TFB/maven"
    ext.MAVEN_PASSWORD = "$System.env.MAVEN_PASSWORD"
    ext.MAVEN_USERNAME = "$System.env.MAVEN_USERNAME"
}

// Nexus repository configuration
repositories {
    mavenCentral()
    maven {
        url "https://forge.theflyingbirds.net/api/packages/TFB/maven"
        credentials {
            username = "${MAVEN_USERNAME}"
            password = "${MAVEN_PASSWORD}"
        }
    }
}

// Type "gradle plugins" in terminal to update plugins
task plugins(type: Copy) {
    doFirst {
        delete fileTree(dir: 'plugins/.', include: '/*.jar')
    }
    from configurations.compileClasspath
    exclude '*Paper*', '*FlameCord*', '*Expansion*', 'Purpur*'
    into 'plugins'
}

// Type "gradle expansions" in terminal to update Expansion files
task expansions(type: Copy) {
    doFirst {
        delete fileTree(dir: 'plugins/PlaceholderAPI/expansions/.', include: '/*.jar')
    }
    from configurations.compileClasspath
    include '*Expansion*'
    into 'plugins/PlaceholderAPI/expansions'
}

// Type "gradle server" in terminal to update server
task server(type: Copy) {
    doFirst {
        delete fileTree(dir: '/.', include: 'server.jar')
    }
    from configurations.compileClasspath
    include 'Paper-*', 'FlameCord-*', 'Purpur-*'
    rename '.*-(.+)', 'server.jar'
    into "."
}

task update(dependsOn: ['server', 'plugins', 'expansions'])

ext.dir = new File("_plugins")
def files = ext.dir.listFiles().findAll { it.isFile() && it.name.endsWith('.jar') }
def allowedPrefixes = ["Paper", "FlameCord", "Purpur", "Expansion"]

def dists = []

files.each { file ->
    if (allowedPrefixes.any { prefix -> file.name.startsWith(prefix) } && file.name.endsWith(".jar")) {
        def fileName = file.name - '.jar' // Remove the ".jar" extension
        
        if (fileName.startsWith("Expansion-")) {
            // Handle Expansion files
            def parts = fileName.split('-')
            // println(parts)
            if (parts.size() >= 1) {
                def groupId = "PAPI"
                def artifactId = "Expansion-" + parts[1]
                def version = parts[2]

                def path = file

                println("Found Expansion JAR: groupId=$groupId, artifactId=$artifactId, version=$version, path=$path")

                dists << [groupId: groupId, artifactId: artifactId, version: version, path: path]
            }
        } else {
            // Handle Paper and FlameCord files
            def parts = fileName.split('-')
            println(parts.toString())
            def groupId = "Server"
            def artifactId = parts[0]
            def version = parts[1]
            
            // Extract the version from the file name
            if (parts.size() > 2) {
                version += "-" + parts[2]
            }
            
            def path = file

            println("Found JAR: groupId=$groupId, artifactId=$artifactId, version=$version, path=$path")

            dists << [groupId: groupId, artifactId: artifactId, version: version, path: path]
        }
    } else {
        def jarFile = new JarFile(file)
        def pluginYml = (jarFile.getEntry("plugin.yml") != null) ? jarFile.getEntry("plugin.yml") : jarFile.getEntry("bungee.yml")
        
        if (pluginYml != null) {
            def yaml = new Yaml()
            def plugin = yaml.load(jarFile.getInputStream(pluginYml))
            
            def groupId = "Plugin"
            def artifactId = plugin.name
            //Adds "-Bungee" to artifact name for plugins like LuckPerms that wont rename their plugin when it's a Bungee-plugin.
            if(file.name.contains("Bungee") && !artifactId.contains("Bungee") || jarFile.getEntry("bungee.yml") && !jarFile.getEntry("plugin.yml")) 
                artifactId += "-Bungee"
            def version = plugin.version.toString()
            
            if (version.contains(" ") || version.contains(";")) {
                version = version.replace(" ", "-").replace(";", "-")
            }

            // Check for Skript dependency
            def dependencies = plugin.depend
            if (dependencies != null && dependencies.contains("Skript")) {
                groupId = "Skript"
            }
            
            def path = file

            println("Found JAR: groupId=$groupId, artifactId=$artifactId, version=$version, path=$path")

            dists << [groupId: groupId, artifactId: artifactId, version: version, path: path]
        }
    }
}

def forgejoRepoBase = "https://forge.theflyingbirds.net/api/packages/TFB/maven"
def forgejoAuthHeader = "token ${MAVEN_PASSWORD}"

def artifactAlreadyExists = { dist ->
    def groupPath = dist.groupId.replace('.', '/')
    def artifactFileName = "${dist.artifactId}-${dist.version}.jar"
    def artifactUrl = "${forgejoRepoBase}/${groupPath}/${dist.artifactId}/${dist.version}/${artifactFileName}"
    try {
        def connection = new URL(artifactUrl).openConnection()
        connection.setRequestMethod("HEAD")
        connection.setRequestProperty("Authorization", forgejoAuthHeader)
        connection.connect()
        def code = connection.responseCode
        if (code == HttpURLConnection.HTTP_OK) {
            println("Skipping upload because artifact already exists: ${dist.groupId}:${dist.artifactId}:${dist.version}")
            return true
        }
        if (code != HttpURLConnection.HTTP_NOT_FOUND) {
            println("Artifact existence check returned HTTP ${code} for ${dist.artifactId}:${dist.version}")
        }
    } catch (Exception e) {
        println("Could not verify artifact existence for ${dist.artifactId}:${dist.version}: ${e.message}")
    }
    return false
}

def skipped = []
dists.removeAll { dist ->
    if (artifactAlreadyExists(dist)) {
        skipped << dist
        return true
    }
    return false
}
if (!skipped.isEmpty()) {
    println("Skipped ${skipped.size()} existing artifact(s) from publish.")
}

publishing {
    publications {
        dists.each { dist ->
            def publicationName = "${dist.artifactId}-${dist.version}".replaceAll(/[^A-Za-z0-9._-]/, '-')
            create(publicationName, MavenPublication) {
                groupId = dist.groupId
                artifactId = dist.artifactId
                version = dist.version

                artifact dist.path
            }
        }
    }
    repositories {
        maven {
            name = "Forge"
            url = uri("https://forge.theflyingbirds.net/api/packages/TFB/maven")

            credentials(HttpHeaderCredentials) {
                name = "Authorization"
                value = "token ${MAVEN_PASSWORD}"
            }

            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}
